name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jobboard
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jobboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobboard -d jobboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: jobboard
      DB_PASSWORD: test_password
      DB_DATABASE: jobboard_test
      DB_SYNCHRONIZE: 'true'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      JWT_ACCESS_SECRET: ci-test-access-secret-32chars
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars
      JWT_REFRESH_EXPIRATION: 7d
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: jobboard-test
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:cov

      - name: Build
        run: npm run build
