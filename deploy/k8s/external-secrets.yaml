# ENF-07 — Secrets management. Example manifest; adapt before use.
# See docs/HARDENING.md (ENF-07).
#
# The app reads every secret from the `cobalt-secrets` Secret (api.yaml:
# envFrom.secretRef). This manifest materialises that Secret from a cloud
# secret manager via the External Secrets Operator (external-secrets.io), so
# no secret value is ever stored in plaintext Git or config. No application
# change is required — the contract is still "read it from the environment".
#
# Prerequisite: install the External Secrets Operator in the cluster.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cobalt-secret-store
spec:
  provider:
    # Swap for gcpsm / vault / azurekv as appropriate.
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        # Prefer IRSA (IAM Roles for Service Accounts) over static keys.
        jwt:
          serviceAccountRef: { name: cobalt-api }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cobalt-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cobalt-secret-store
    kind: SecretStore
  target:
    # Produces the Secret that api.yaml / db-backup.yaml consume.
    name: cobalt-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef: { key: cobalt/prod/database-url }
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: { key: cobalt/prod/jwt-access-secret }
    - secretKey: JWT_REFRESH_SECRET
      remoteRef: { key: cobalt/prod/jwt-refresh-secret }
    - secretKey: SCORING_WEBHOOK_SECRET
      remoteRef: { key: cobalt/prod/scoring-webhook-secret }
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: { key: cobalt/prod/stripe-secret-key }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: cobalt/prod/stripe-webhook-secret }
    - secretKey: MFA_ENCRYPTION_KEY
      remoteRef: { key: cobalt/prod/mfa-encryption-key }
