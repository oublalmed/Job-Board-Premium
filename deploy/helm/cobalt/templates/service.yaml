apiVersion: v1
kind: Service
metadata:
  name: {{ include "cobalt.fullname" . }}
  labels:
    {{- include "cobalt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cobalt.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
